name: Build App

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  APP_NAME: "Whispera"
  SCHEME_NAME: "Whispera"

# Read-only token: these jobs only build and test. Third-party actions are pinned to full
# commit SHAs; the comment names the release.
permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          # The FoundationModels weak link needs the macOS 26 SDK
          xcode-version: "^26.0"

      - name: Cache Swift Package Manager
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Clean stale build artifacts
        run: |
          find ~/Library/Developer/Xcode/DerivedData -name "*.pcm" -delete 2>/dev/null || true

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project "${APP_NAME}.xcodeproj" -scheme "${SCHEME_NAME}"

      - name: Build app (unsigned for CI validation)
        run: |
          echo "🔨 Building Whispera app..."

          # Build using scheme (includes test targets but they won't be run)
          # Using destination platform to avoid C compilation issues
          xcodebuild build \
                     -project "${APP_NAME}.xcodeproj" \
                     -scheme "${SCHEME_NAME}" \
                     -configuration Debug \
                     -destination "platform=macOS,arch=arm64" \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO

          # Check if the main app binary was created
          APP_BUNDLE=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -type d \
            -path "*/Build/Products/Debug/${APP_NAME}.app" | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            echo "✅ Main app built successfully"
            ls -la "$APP_BUNDLE"
          else
            echo "❌ Build failed - app bundle not found"
            exit 1
          fi

      - name: Check for SwiftUI deprecations
        run: |
          # Look for deprecated SwiftUI APIs
          if grep -r "\.navigationBarTitle\|\.navigationBarItems" --include="*.swift" . ; then
            echo "⚠️ Found deprecated SwiftUI APIs"
          fi

      - name: Analyze code size
        run: |
          # Basic code metrics
          echo "📊 Code Statistics:"
          find . -name "*.swift" -not -path "./build/*" -not -path "./DerivedData/*" | wc -l | xargs echo "Swift files:"
          find . -name "*.swift" -not -path "./build/*" -not -path "./DerivedData/*" -exec wc -l {} + | tail -1 | xargs echo "Total lines:"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            build/DerivedData/Logs/Test/
            build/
          retention-days: 3

  unit-tests:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "^26.0"

      - name: Cache Swift Package Manager
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Tests that need a downloaded Whisper or Parakeet model, the bundled test recording,
      # Apple Intelligence or an unlocked keychain skip themselves via .enabled(if:), so this
      # runs the logic suites only. XCTest targets and UI tests need models or a GUI session.
      # A runner with openai_whisper-small in the app's model folder should set
      # TEST_RUNNER_WHISPERA_REQUIRE_MODEL_TESTS=1 so the real-model live suites fail instead of
      # skipping if the model goes missing.
      - name: Run WhisperaUnitTests
        env:
          # YouTube refuses video info to runner addresses
          TEST_RUNNER_WHISPERA_SKIP_YOUTUBE_TESTS: "1"
        run: |
          set -o pipefail
          xcodebuild test \
                     -project "${APP_NAME}.xcodeproj" \
                     -scheme "${SCHEME_NAME}" \
                     -destination "platform=macOS,arch=arm64" \
                     -only-testing:WhisperaUnitTests \
                     -parallel-testing-enabled NO \
                     -resultBundlePath build/UnitTests.xcresult \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: build/UnitTests.xcresult
          retention-days: 7
