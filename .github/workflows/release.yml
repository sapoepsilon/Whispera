name: Release Whispera

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.3)"
        required: true
        type: string

env:
  APP_NAME: "Whispera"
  SCHEME_NAME: "Whispera"
  BUILD_CONFIGURATION: "Release"

# Third-party actions are pinned to full commit SHAs; the comment names the release.
permissions:
  contents: read

jobs:
  # Builds, signs with the Developer ID, notarizes and staples. It runs the repo's build code
  # (and every package it compiles), so it never sees the Sparkle private key and cannot push.
  build:
    # A manual dispatch from a branch must never publish a release; only a tag ref may
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.artifacts.outputs.build }}
      minimum_system: ${{ steps.artifacts.outputs.minimum_system }}
      dmg_sha256: ${{ steps.artifacts.outputs.dmg_sha256 }}
      zip_sha256: ${{ steps.artifacts.outputs.zip_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          # The FoundationModels weak link needs the macOS 26 SDK
          xcode-version: "^26.0"

      # The Sparkle framework embedded in the app must be the official release
      - name: Verify vendored Sparkle against the official release
        run: ./scripts/verify-sparkle.sh "$GITHUB_WORKSPACE"

      # Free-text input and tag names reach later steps only through env and only after this
      # check, so they are never pasted into a script
      - name: Get version from tag or input
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          # A dispatch runs on a tag ref (job condition); the input must name that same tag
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::Version input does not match the tag this run was dispatched on"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Bump version in project
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh "$VERSION"

      - name: Build and archive
        run: |
          set -e

          # Clean previous builds
          rm -rf build/Release
          mkdir -p build/Release

          # Build and archive
          xcodebuild -project "${APP_NAME}.xcodeproj" \
                     -scheme "${SCHEME_NAME}" \
                     -configuration "${BUILD_CONFIGURATION}" \
                     -archivePath "./build/Release/${APP_NAME}.xcarchive" \
                     -destination "generic/platform=macOS" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     archive

      - name: Export app
        run: |
          xcodebuild -exportArchive \
                     -archivePath "./build/Release/${APP_NAME}.xcarchive" \
                     -exportPath "./build/Release" \
                     -exportOptionsPlist "scripts/ExportOptions-dev.plist"

      # The Developer ID identity exists only from here to the end of notarization: the unsigned
      # archive and export above (which run repo build code) never have it in reach
      - name: Setup signing keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          chmod +x scripts/setup-keychain.sh
          ./scripts/setup-keychain.sh

      # Fails the release unless the app and the DMG are both notarized (status Accepted),
      # stapled, and accepted by stapler validate and spctl
      - name: Sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          chmod +x scripts/release-distribute-ci.sh
          ./scripts/release-distribute-ci.sh

      # Codesigning, notarization and stapling are done; nothing after this needs the identity
      - name: Delete signing keychain
        if: always()
        run: security delete-keychain whispera-signing.keychain-db 2>/dev/null || true

      # The checkout's Info.plist keeps the previous build number (the bump above is local to
      # this runner), so the appcast takes its values from the built app via these outputs
      - name: Record release artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PLIST="dist/${APP_NAME}.app/Contents/Info.plist"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          MINIMUM_SYSTEM=$(/usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "$PLIST")
          if [ "$SHORT" != "$VERSION" ]; then
            echo "::error::The built app is version $SHORT, not $VERSION"
            exit 1
          fi
          if ! [[ "$BUILD" =~ ^[0-9]+(\.[0-9]+)*$ ]] || ! [[ "$MINIMUM_SYSTEM" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::The built app has an invalid CFBundleVersion or LSMinimumSystemVersion"
            exit 1
          fi
          DMG_SHA=$(shasum -a 256 "dist/${APP_NAME}-${VERSION}.dmg")
          ZIP_SHA=$(shasum -a 256 "dist/${APP_NAME}.app.zip")
          {
            echo "build=$BUILD"
            echo "minimum_system=$MINIMUM_SYSTEM"
            echo "dmg_sha256=${DMG_SHA%% *}"
            echo "zip_sha256=${ZIP_SHA%% *}"
          } >> "$GITHUB_OUTPUT"
          echo "DMG SHA-256: ${DMG_SHA%% *}"

      - name: Upload the release DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dmg
          path: dist/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the zipped app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip
          path: dist/${{ env.APP_NAME }}.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        run: |
          # Fallback for a run that failed before the keychain step's own cleanup
          security delete-keychain whispera-signing.keychain-db 2>/dev/null || true

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs
          path: |
            build/
            *.log
            dist/notary-log-*.json
          retention-days: 7

  # The only job that sees SPARKLE_PRIVATE_KEY. It checks out nothing and runs no repo code:
  # it takes the DMG from the build job, checks it is the notarized Developer ID build that job
  # hashed, fetches the official sign_update by pinned hash, and signs with it.
  sparkle-sign:
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
      ed_signature: ${{ steps.sign.outputs.ed_signature }}
      length: ${{ steps.sign.outputs.length }}

    steps:
      - name: Download the release DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dmg
          path: ${{ runner.temp }}/dmg

      - name: Verify the DMG
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          EXPECTED_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version from the build job"
            exit 1
          fi
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::TEAM_ID is not a ten-character team identifier"
            exit 1
          fi
          DMG="$RUNNER_TEMP/dmg/${APP_NAME}-${VERSION}.dmg"
          ACTUAL=$(/usr/bin/shasum -a 256 "$DMG")
          if [ -z "$EXPECTED_SHA256" ] || [ "${ACTUAL%% *}" != "$EXPECTED_SHA256" ]; then
            echo "::error::The downloaded DMG is not the one the build job hashed"
            exit 1
          fi
          REQUIREMENT="=anchor apple generic and certificate leaf[subject.OU] = \"$TEAM_ID\""

          /usr/bin/codesign --verify --strict --verbose=2 -R "$REQUIREMENT" "$DMG"
          /usr/sbin/spctl -a -vv -t open --context context:primary-signature "$DMG"
          /usr/bin/xcrun stapler validate "$DMG"

          MOUNT=$(/usr/bin/mktemp -d "$RUNNER_TEMP/dmg-mount.XXXXXX")
          /usr/bin/hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MOUNT" "$DMG" > /dev/null
          trap '/usr/bin/hdiutil detach "$MOUNT" -force > /dev/null || :' EXIT
          APP="$MOUNT/${APP_NAME}.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 -R "$REQUIREMENT" "$APP"
          /usr/sbin/spctl -a -vv -t exec "$APP"
          /usr/bin/xcrun stapler validate "$APP"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUNDLE_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Contents/Info.plist")
          if [ "$SHORT" != "$VERSION" ] || [ "$BUNDLE_BUILD" != "$BUILD" ]; then
            echo "::error::The app in the DMG is $SHORT ($BUNDLE_BUILD), expected $VERSION ($BUILD)"
            exit 1
          fi
          echo "DMG verified: notarized, stapled, signed by team $TEAM_ID"

      # sign_update receives the private key, so it must be the official release binary: the
      # Sparkle 2.9.0 SwiftPM zip, pinned to the SHA-256 recorded in Packages/VENDORED.md
      - name: Download and verify Sparkle sign_update
        id: sparkle
        env:
          SPARKLE_URL: https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-for-Swift-Package-Manager.zip
          SPARKLE_SHA256: 44a0d5a00d5bfb6c2ad1755a92b694d948876d61ad44f35a0119eb0e7ace4b65
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sparkle"
          /bin/rm -rf "$WORK"
          /bin/mkdir -p "$WORK/unpacked"
          /usr/bin/curl -fsSL --proto '=https' --retry 3 -o "$WORK/sparkle.zip" "$SPARKLE_URL"
          ACTUAL=$(/usr/bin/shasum -a 256 "$WORK/sparkle.zip")
          if [ "${ACTUAL%% *}" != "$SPARKLE_SHA256" ]; then
            echo "::error::Sparkle zip SHA-256 is ${ACTUAL%% *}, expected $SPARKLE_SHA256"
            exit 1
          fi
          /usr/bin/ditto -x -k "$WORK/sparkle.zip" "$WORK/unpacked"
          TOOL="$WORK/unpacked/bin/sign_update"
          /bin/test -x "$TOOL"
          TOOL_SHA=$(/usr/bin/shasum -a 256 "$TOOL")
          echo "sign_update_sha256=${TOOL_SHA%% *}" >> "$GITHUB_OUTPUT"
          echo "Verified sign_update: ${TOOL_SHA%% *}"

      # The key goes to sign_update on stdin (--ed-key-file -), never in argv, a file or the
      # tool's environment, which env -i empties
      - name: Sign the update for Sparkle
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          EXPECTED_TOOL_SHA256: ${{ steps.sparkle.outputs.sign_update_sha256 }}
          EXPECTED_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TOOL="$RUNNER_TEMP/sparkle/unpacked/bin/sign_update"
          DMG="$RUNNER_TEMP/dmg/${APP_NAME}-${VERSION}.dmg"
          ACTUAL_TOOL=$(/usr/bin/shasum -a 256 "$TOOL")
          if [ -z "$EXPECTED_TOOL_SHA256" ] || [ "${ACTUAL_TOOL%% *}" != "$EXPECTED_TOOL_SHA256" ]; then
            echo "::error::sign_update changed since it was verified; refusing to sign"
            exit 1
          fi
          ACTUAL_DMG=$(/usr/bin/shasum -a 256 "$DMG")
          if [ "${ACTUAL_DMG%% *}" != "$EXPECTED_SHA256" ]; then
            echo "::error::The DMG changed since it was verified; refusing to sign"
            exit 1
          fi
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set; the update cannot be signed"
            exit 1
          fi
          OUTPUT=$(printf '%s\n' "$SPARKLE_PRIVATE_KEY" \
            | /usr/bin/env -i PATH=/usr/bin:/bin "$TOOL" --ed-key-file - "$DMG")
          unset SPARKLE_PRIVATE_KEY
          SIGNATURE=$(printf '%s' "$OUTPUT" | /usr/bin/tr -d '\r\n')
          PATTERN='^sparkle:edSignature="([A-Za-z0-9+/=]+)" length="([0-9]+)"$'
          if ! [[ "$SIGNATURE" =~ $PATTERN ]]; then
            echo "::error::sign_update did not produce a signature"
            exit 1
          fi
          ED_SIGNATURE="${BASH_REMATCH[1]}"
          LENGTH="${BASH_REMATCH[2]}"
          if [ "$LENGTH" != "$(/usr/bin/stat -f %z "$DMG")" ]; then
            echo "::error::The signed length does not match the DMG size"
            exit 1
          fi
          {
            echo "signature=$SIGNATURE"
            echo "ed_signature=$ED_SIGNATURE"
            echo "length=$LENGTH"
          } >> "$GITHUB_OUTPUT"
          echo "Signed ${APP_NAME}-${VERSION}.dmg ($LENGTH bytes)"

  # Publishes what the two jobs above produced: the GitHub release with the verified files, and
  # appcast.xml on main. Holds no signing secret.
  release:
    needs: [build, sparkle-sign]
    runs-on: macos-15
    permissions:
      contents: write # Creates the release and pushes the appcast to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The token is not left in .git/config; the push steps pass it explicitly
          persist-credentials: false

      - name: Download the release DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dmg
          path: dist

      - name: Download the zipped app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip
          path: dist

      # The release must carry exactly the DMG that was verified and Sparkle-signed
      - name: Verify release files
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DMG_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          DMG="dist/${APP_NAME}-${VERSION}.dmg"
          ACTUAL_DMG=$(shasum -a 256 "$DMG")
          ACTUAL_ZIP=$(shasum -a 256 "dist/${APP_NAME}.app.zip")
          if [ -z "$DMG_SHA256" ] || [ "${ACTUAL_DMG%% *}" != "$DMG_SHA256" ] \
            || [ -z "$ZIP_SHA256" ] || [ "${ACTUAL_ZIP%% *}" != "$ZIP_SHA256" ]; then
            echo "::error::The downloaded release files are not the ones the build job hashed"
            exit 1
          fi
          # Unversioned copy for the releases/latest/download/Whispera.dmg link
          cp "$DMG" "dist/${APP_NAME}.dmg"

      - name: Write appcast.xml
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          MINIMUM_SYSTEM: ${{ needs.build.outputs.minimum_system }}
          SPARKLE_SIGNATURE: ${{ needs.sparkle-sign.outputs.signature }}
        run: ./scripts/write-appcast.sh

      - name: Create release notes
        # The release body is what the app shows in What's New. Curate it in
        # release-notes/vX.Y.Z.md; without that file the feat/fix/perf subjects are used.
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/release-notes.sh "$VERSION" release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "Whispera ${{ needs.build.outputs.version }}"
          body_path: release_notes.md
          files: |
            dist/Whispera.dmg
            dist/Whispera-${{ needs.build.outputs.version }}.dmg
            dist/Whispera.app.zip
          draft: false
          prerelease: false

      - name: Publish appcast.xml to main
        if: success()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          # The checkout's own appcast.xml is the previous release's; only one written for this
          # version and signed by the Sparkle job may reach the update feed
          if ! grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" appcast.xml \
            || ! grep -q 'sparkle:edSignature="' appcast.xml; then
            echo "::error::appcast.xml was not generated and signed for $VERSION; the update feed was not published"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # checkout runs with persist-credentials: false, so the token is passed per command
          # and never written to .git/config
          GIT_AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$GIT_AUTH"
          git_auth() { git -c "http.https://github.com/.extraheader=$GIT_AUTH" "$@"; }

          git_auth fetch origin main

          git worktree remove --force main-worktree 2>/dev/null || true
          rm -rf main-worktree
          git worktree add --detach main-worktree origin/main

          cp appcast.xml main-worktree/appcast.xml

          cd main-worktree

          git add appcast.xml
          if git diff --staged --quiet; then
            echo "No changes to appcast.xml"
            exit 0
          fi

          git commit -m "chore(release): update appcast for v$VERSION"
          git_auth push origin HEAD:main

          echo "Appcast committed and pushed"

  # A job of its own so a cask problem never holds back the release or Sparkle updates, yet
  # still fails visibly instead of hiding behind continue-on-error. The hash comes from the
  # published asset, so the cask matches what users download.
  homebrew-cask:
    needs: [build, release]
    runs-on: macos-15
    permissions:
      contents: write # Pushes the cask bump to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The token is not left in .git/config; the push steps pass it explicitly
          persist-credentials: false

      - name: Bump Homebrew cask on main
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # checkout runs with persist-credentials: false, so the token is passed per command
          # and never written to .git/config
          GIT_AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$GIT_AUTH"
          git_auth() { git -c "http.https://github.com/.extraheader=$GIT_AUTH" "$@"; }

          git_auth fetch origin main
          git worktree add --detach main-worktree origin/main

          if [ ! -f main-worktree/Casks/whispera.rb ]; then
            echo "::warning::Casks/whispera.rb is not on main, skipping the cask bump"
            exit 0
          fi

          CASK_PATH="main-worktree/Casks/whispera.rb" CASK_SKIP_STYLE=1 \
            ./scripts/update-cask.sh "$VERSION"

          cd main-worktree

          git add Casks/whispera.rb
          if git diff --staged --quiet; then
            echo "No changes to the cask"
            exit 0
          fi

          git commit -m "chore(release): bump Homebrew cask to v$VERSION"
          git_auth push origin HEAD:main

          echo "✅ Cask committed and pushed"

      - name: Report a failed cask bump
        if: failure()
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "::warning::The Homebrew cask was not bumped to $VERSION. The release and appcast are published; run ./scripts/update-cask.sh $VERSION and push Casks/whispera.rb."
          {
            echo "### Homebrew cask not bumped"
            echo
            echo "The release and appcast for $VERSION are published, but Casks/whispera.rb still points at the previous version."
            echo "Run \`./scripts/update-cask.sh $VERSION\` and push the change."
          } >> "$GITHUB_STEP_SUMMARY"
